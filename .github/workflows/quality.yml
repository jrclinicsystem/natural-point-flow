name: Natural Point Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply pending type fixes
        run: python3 .github/scripts/fix-natural-point-types.py
      - name: Install dependencies
        run: bun install
      - name: Production build
        run: bun run build
      - name: TypeScript check
        run: bun x tsc --noEmit
      - name: Persist generated files and fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src bun.lock
            git commit -m "fix: finalize Natural Point operational screens"
            git push
          fi
