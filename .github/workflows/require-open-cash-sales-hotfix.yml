name: Require open cash for sales hotfix

on:
  push:
    paths:
      - '.github/scripts/require_open_cash_sales_patch.py'
      - '.github/hotfix-triggers/require-open-cash-sales.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply open-cash sales patch
        run: python .github/scripts/require_open_cash_sales_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck diagnostics
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Commit Natural Point sales fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/vendas.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: block sales while cash register is closed"
          git push origin main
