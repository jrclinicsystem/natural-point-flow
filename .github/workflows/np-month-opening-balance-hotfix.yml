name: Natural Point Month Opening Balance Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/np_month_opening_balance_patch.py'
      - '.github/workflows/np-month-opening-balance-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply balance visibility patch
        run: python .github/scripts/np_month_opening_balance_patch.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: TypeScript check
        run: bun x tsc --noEmit
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/dashboard.tsx src/routes/relatorios.tsx
          git commit -m "fix: show carried opening balance between months"
          git push origin HEAD:main
